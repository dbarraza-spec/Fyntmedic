<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>FyntMedic</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
/* VOICE: clínico, claro, amable — la oficina del médico con la marca Fynt
   IDEA: el expediente de papel hecho pantalla: carpeta, notas selladas, sello digital
   PICTURE: el buscador y las tarjetas del paciente son la pieza principal
   COLOUR/TYPE: guía de estilos Fynt (azul #0077b6, marino, fondo #F4F8FC), Inter
   LAYOUT: menú lateral + contenido; en iPad/teléfono el menú pasa arriba */
:root{color-scheme:light;--azul:#0077b6;--azul-hover:color-mix(in srgb,var(--azul) 80%,#000);--azul-claro:color-mix(in srgb,var(--azul) 10%,#fff);--marino:#0B1C33;--texto:#0f172a;--texto-2:#334155;--gris:#64748B;--gris-claro:#94A3B8;--fondo:#F4F8FC;--borde:#E2E8F0;--borde-suave:#EEF2F6;--verde:#16A34A;--verde-f:#DCFCE7;--verde-t:#15803D;--ama:#F59E0B;--ama-f:#FEF3C7;--ama-t:#92400E;--rojo:#DC2626;--rojo-f:#FEE2E2;--rojo-t:#B91C1C}
*{box-sizing:border-box;min-width:0}
body{margin:0;font:15px/1.5 Inter,system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--texto);background:var(--fondo);-webkit-font-smoothing:antialiased;overflow-x:clip}
a{color:var(--azul);text-decoration:none}
h1{font-size:clamp(24px,3vw,30px);font-weight:800;letter-spacing:-.02em;margin:0;line-height:1.15}
h2{font-size:17px;font-weight:800;margin:0}
.app{display:flex;min-height:100vh}
.side{width:244px;flex:none;background:#fff;border-right:1px solid var(--borde);padding:20px 14px;display:flex;flex-direction:column;gap:4px;position:sticky;top:0;height:100vh}
.brand{display:flex;align-items:center;gap:10px;padding:0 8px 18px}
.brand img{width:40px;height:40px;object-fit:contain;border-radius:10px}
.brand b{font-size:17px;line-height:1.15;display:block}.brand small{font-size:11.5px;color:var(--gris)}
.mi{display:flex;align-items:center;gap:10px;padding:11px 12px;border-radius:10px;color:var(--texto-2);font-size:14px;font-weight:600;min-height:44px}
.mi:hover{background:var(--fondo);color:var(--texto)}.mi.on{background:var(--azul-claro);color:var(--azul);font-weight:700}
.mi svg{flex:none}
.tag{margin-left:auto;font-size:10px;font-weight:800;background:var(--ama-f);color:var(--ama-t);padding:3px 7px;border-radius:99px}
.demo{margin-top:auto;font-size:12px;color:var(--gris);background:var(--fondo);border-radius:12px;padding:12px;line-height:1.45}
main{flex:1;padding:28px clamp(16px,3vw,40px) 60px;display:flex;flex-direction:column;gap:18px;max-width:1320px}
.top{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end;justify-content:space-between}
.sub{font-size:14px;color:var(--gris);margin-top:4px}
.back{font-size:14px;font-weight:600}
.card{background:#fff;border:1px solid var(--borde);border-radius:20px;padding:20px;display:flex;flex-direction:column;gap:14px}
.dark{background:var(--marino);color:#fff;border:0}.dark .sub,.dark .nota{color:#B6C3D4}
.g2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(380px,100%),1fr));gap:18px;align-items:start}
.g3{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(200px,100%),1fr));gap:12px}
.g4{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(150px,100%),1fr));gap:12px}
.col{display:flex;flex-direction:column;gap:18px}
.fila{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 22px;border-radius:99px;font:700 15px Inter,sans-serif;cursor:pointer;border:0;background:var(--azul);color:#fff;white-space:nowrap}
.btn:hover{background:var(--azul-hover);color:#fff}
.btn.sec{background:#fff;color:var(--texto);border:1.5px solid var(--borde)}.btn.sec:hover{border-color:var(--azul);color:var(--azul)}
.btn.borde{background:#fff;color:var(--azul);border:1.5px solid var(--azul)}
.btn.osc{background:transparent;color:#fff;border:1.5px solid rgba(255,255,255,.4)}
.btn.peligro{background:var(--rojo)}
.btn.ch{min-height:40px;padding:0 16px;font-size:13.5px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.c{display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:600;color:var(--texto-2)}
.i{width:100%;min-height:46px;border:1.5px solid var(--borde);border-radius:12px;padding:0 14px;font:500 16px Inter,sans-serif;color:var(--texto);background:#fff;outline:none}
textarea.i{padding:11px 14px;min-height:84px;resize:vertical;line-height:1.45}
.i:focus,.ii:focus-within{border-color:var(--azul);box-shadow:0 0 0 4px var(--azul-claro)}
.i:disabled,.i[readonly]{background:#F8FAFC;color:var(--gris)}
.ayuda{font-size:12.5px;color:var(--gris);font-weight:500}
.ii{display:flex;align-items:center;gap:10px;border:1.5px solid var(--borde);border-radius:12px;padding:0 14px;background:#fff;color:var(--gris)}
.ii input{flex:1;border:0;outline:0;font:500 16px Inter,sans-serif;padding:13px 0;background:transparent;color:var(--texto)}
.chk{display:flex;align-items:flex-start;gap:10px;font-size:14px;color:var(--texto-2);font-weight:500}
.chk input{width:20px;height:20px;accent-color:var(--azul);flex:none;margin-top:1px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:700;padding:6px 12px;border-radius:99px;background:var(--azul-claro);color:var(--azul)}
.chip.v{background:var(--verde-f);color:var(--verde-t)}.chip.a{background:var(--ama-f);color:var(--ama-t)}.chip.r{background:var(--rojo-f);color:var(--rojo-t)}.chip.g{background:#F1F5F9;color:var(--gris)}
.chip button{border:0;background:none;color:inherit;font:inherit;cursor:pointer;padding:0 2px}
.op{display:inline-flex}.op input{position:absolute;opacity:0;pointer-events:none}
.op span{border:1.5px solid var(--borde);background:#fff;border-radius:99px;padding:9px 15px;font:700 14px Inter,sans-serif;color:var(--texto-2);cursor:pointer;min-height:40px;display:inline-flex;align-items:center}
.op input:checked+span{background:var(--azul);border-color:var(--azul);color:#fff}
.op input:focus-visible+span{box-shadow:0 0 0 4px var(--azul-claro)}
.tabs{display:flex;flex-wrap:wrap;gap:8px}
.tab{border:1.5px solid var(--borde);background:#fff;border-radius:99px;padding:9px 16px;font:700 14px Inter,sans-serif;color:var(--texto-2);cursor:pointer;min-height:42px}
.tab.on{background:var(--azul);border-color:var(--azul);color:#fff}
.kpi{background:#fff;border:1px solid var(--borde);border-radius:20px;padding:16px 18px}
.kpi b{display:block;font-size:28px;font-weight:800;letter-spacing:-.02em;font-variant-numeric:tabular-nums}.kpi span{font-size:13px;color:var(--gris);font-weight:600}
.hero{background:var(--marino);border-radius:20px;padding:26px clamp(18px,3vw,32px);color:#fff;position:relative;overflow:hidden}
.hero .ii{border-radius:99px;padding:5px 5px 5px 18px;max-width:760px;border:0;position:relative}
.hero .bola{position:absolute;border-radius:50%;animation:flot 5s ease-in-out infinite}
@keyframes flot{50%{transform:translateY(-8px)}}
@keyframes up{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
main>*{animation:up .45s ease both}main>*:nth-child(2){animation-delay:.05s}main>*:nth-child(3){animation-delay:.1s}main>*:nth-child(4){animation-delay:.15s}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}
.pac{display:flex;flex-direction:column;gap:10px;border:1px solid var(--borde);border-radius:18px;padding:16px;background:#fff;color:inherit;transition:box-shadow .15s,border-color .15s}
.pac:hover{border-color:color-mix(in srgb,var(--azul) 35%,#fff);box-shadow:0 12px 28px rgba(0,60,100,.09)}
.av{width:44px;height:44px;border-radius:50%;color:#fff;font-weight:800;display:flex;align-items:center;justify-content:center;flex:none}
.tl{display:flex;flex-direction:column;gap:12px;position:relative;padding-left:26px}
.tl:before{content:"";position:absolute;left:8px;top:8px;bottom:8px;width:2px;background:var(--borde)}
.nt{position:relative;border:1px solid var(--borde);border-radius:16px;padding:14px 16px;background:#fff}
.nt i{position:absolute;left:-24px;top:18px;width:14px;height:14px;border-radius:50%;border:3px solid #fff}
.tb-caja{overflow-x:auto;border:1px solid var(--borde);border-radius:16px;background:#fff}
table{width:100%;border-collapse:collapse;font-size:14px}
th{background:var(--marino);color:#fff;font-size:11.5px;font-weight:700;letter-spacing:.05em;text-align:left;padding:11px 14px;white-space:nowrap}
td{padding:11px 14px;border-top:1px solid var(--borde-suave);color:var(--texto-2);vertical-align:middle}
td.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.hf td,.hf th{text-align:center}.hf td:first-child,.hf th:first-child{text-align:left}.hf input{width:20px;height:20px;accent-color:var(--azul)}
.vit{display:grid;grid-template-columns:repeat(auto-fit,minmax(118px,1fr));gap:10px}
.vit label{border-radius:14px;padding:9px 11px;font-size:11.5px;font-weight:800;display:flex;flex-direction:column;gap:2px}
.vit input{border:0;background:transparent;font:800 20px Inter,sans-serif;color:var(--texto);width:100%;outline:none;padding:2px 0}
.pk-res{display:flex;flex-direction:column;border:1px solid var(--borde);border-radius:14px;overflow:hidden}
.pk-res:empty{display:none}
.pk-res button{display:flex;gap:12px;text-align:left;border:0;border-top:1px solid var(--borde-suave);background:#fff;padding:11px 14px;font:500 14px Inter,sans-serif;color:var(--texto);cursor:pointer}
.pk-res button:first-child{border-top:0}.pk-res button:hover,.pk-res button:focus{background:var(--azul-claro);outline:none}
.pk-res b{color:var(--azul);min-width:54px}
.aviso{border-radius:14px;padding:12px 14px;font-size:14px;line-height:1.45;background:var(--azul-claro);color:#0b4f78}
.aviso.ok{background:var(--verde-f);color:var(--verde-t)}.aviso.al{background:var(--ama-f);color:var(--ama-t)}.aviso.er{background:var(--rojo-f);color:var(--rojo-t)}
.barra{position:sticky;bottom:12px;z-index:5;background:var(--marino);border-radius:16px;padding:12px 16px;display:flex;flex-wrap:wrap;gap:10px;align-items:center;color:#B6C3D4;font-size:13.5px;box-shadow:0 12px 30px rgba(11,28,51,.25)}
.barra span{flex:1 1 220px}
.ver h3{font-size:11.5px;font-weight:800;letter-spacing:.06em;color:var(--azul);margin:14px 0 4px}
.ver p{margin:0;white-space:pre-wrap}
.thumbs{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:10px}
.th{aspect-ratio:1;border-radius:14px;border:1px solid var(--borde);background:#F8FAFC;overflow:hidden;display:flex;flex-direction:column;justify-content:flex-end;cursor:pointer;position:relative;padding:0;font:inherit;text-align:left}
.th img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.th span{position:relative;background:rgba(255,255,255,.92);font-size:11.5px;font-weight:700;padding:6px 8px;color:var(--texto)}
.th em{position:absolute;top:10px;left:10px;font-style:normal;font-size:11px;font-weight:800;padding:4px 8px;border-radius:8px;background:var(--rojo-f);color:var(--rojo-t)}
.subir{border:1.5px dashed #9CC9E6;border-radius:14px;padding:18px;text-align:center;color:var(--azul);font-weight:700;background:#F8FBFF;cursor:pointer;display:block}
.subir input{display:block;margin:10px auto 0;font-size:13px;color:var(--gris)}
canvas.firma{width:100%;height:150px;border:1.5px solid var(--borde);border-radius:12px;background:#fff;touch-action:none;cursor:crosshair}
.sw{display:flex;align-items:center;gap:8px;border:2px solid var(--borde);background:#fff;border-radius:12px;padding:10px;font:600 13px Inter,sans-serif;cursor:pointer;color:var(--texto);min-height:46px}
.sw.on{border-color:var(--sc)}.sw i{width:22px;height:22px;border-radius:50%;background:var(--sc);flex:none}
.prog{height:10px;border-radius:99px;background:var(--borde);overflow:hidden;width:180px}.prog i{display:block;height:100%;background:var(--azul);border-radius:99px}
.vacio{text-align:center;color:var(--gris);padding:26px;border:1.5px dashed var(--borde);border-radius:16px}
.mf{position:fixed;inset:0;background:rgba(15,23,42,.6);display:flex;align-items:center;justify-content:center;padding:16px;z-index:50}
.mf[hidden]{display:none}
.md{width:min(560px,100%);max-height:90vh;overflow:auto;background:#fff;border-radius:22px;padding:24px;display:flex;flex-direction:column;gap:14px;box-shadow:0 20px 50px rgba(15,23,42,.2)}
#toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--marino);color:#fff;padding:12px 18px;border-radius:14px;font-size:14px;font-weight:600;z-index:60;max-width:min(520px,92vw);box-shadow:0 12px 30px rgba(0,0,0,.25)}
#toast[hidden]{display:none}
.ag-caja{overflow-x:auto;border:1px solid var(--borde);border-radius:16px;background:#fff}
.ag{display:grid;grid-template-columns:58px repeat(7,minmax(104px,1fr));grid-template-rows:50px;grid-auto-rows:30px;min-width:790px;position:relative}
.ag .dh{grid-row:1;position:sticky;top:0;background:#fff;border-bottom:1px solid var(--borde);display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:12px;color:var(--gris);font-weight:700;z-index:2;cursor:pointer;border-left:1px solid var(--borde-suave)}
.ag .dh b{font-size:17px;color:var(--texto)}.ag .dh.hoy b{background:var(--azul);color:#fff;border-radius:99px;padding:0 9px}
.ag .hr{grid-column:1;font-size:11px;color:var(--gris);text-align:right;padding-right:8px;transform:translateY(-7px)}
.ag .sl{border:0;border-top:1px solid var(--borde-suave);border-left:1px solid var(--borde-suave);background:transparent;cursor:pointer;padding:0}
.ag .sl:hover{background:var(--azul-claro)}.ag .sl.m{border-top-style:dashed}
.ag .ct{margin-top:1px;margin-bottom:1px;border-radius:9px;padding:4px 7px;font:600 11.5px/1.25 Inter,sans-serif;text-align:left;border:0;cursor:pointer;overflow:hidden;z-index:1;border-left:4px solid}
.ag .ahora{grid-column:2/-1;height:2px;background:var(--rojo);z-index:3;align-self:start;pointer-events:none}
.dl{display:flex;flex-direction:column;gap:8px}
.ci{display:flex;gap:12px;align-items:center;border:1px solid var(--borde);border-radius:14px;padding:10px 14px;background:#fff;cursor:pointer;text-align:left;font:inherit;color:inherit;width:100%}
.ci .h{font-size:17px;font-weight:800;min-width:58px;font-variant-numeric:tabular-nums}
@media(max-width:900px){
 .app{flex-direction:column}
 .side{width:auto;height:auto;position:sticky;top:0;z-index:20;flex-direction:row;overflow-x:auto;padding:10px;border-right:0;border-bottom:1px solid var(--borde)}
 .brand{padding:0 8px 0 4px;flex:none}.brand b{white-space:nowrap}.brand small,.demo{display:none}.mi{flex:none}
}
@media(max-width:600px){.top .btn{width:100%}main{padding-top:18px}}
</style>
</head>

 <nav class="side" id="side" aria-label="Menú"></nav>
 <main id="main"></main>
</div>
<div class="mf" id="mf" hidden><div class="md" id="md" role="dialog" aria-modal="true"></div></div>

/* ---------- Agenda ---------- */
let altaPre=null;
const lunes=d=>{const x=new Date(d);x.setHours(0,0,0,0);x.setDate(x.getDate()-((x.getDay()+6)%7));return x};
let agSem=lunes(new Date()),agDia=ymd(new Date());
const H0=8,H1=21,SLOTS=(H1-H0)*2;
const ECOL={Programada:['#EAF2FF','#0077b6'],Confirmada:['#DCFCE7','#16A34A'],Atendida:['#F1F5F9','#64748B'],'No asistió':['#FEF3C7','#F59E0B'],Cancelada:['#FEE2E2','#DC2626']};
const cNom=c=>{const p=c.pid&&P(c.pid);return p?nom(p):(c.nombre||'Sin nombre')};
const minu=h=>{const[a,b]=h.split(':');return+a*60+ +b};
const finH=c=>{const m=minu(c.hora)+(+c.dur||30);return p2(Math.floor(m/60))+':'+p2(m%60)};
const DIAS=['Lun','Mar','Mié','Jue','Vie','Sáb','Dom'];
const fLarga=f=>new Date(f+'T12:00').toLocaleDateString('es-MX',{weekday:'long',day:'numeric',month:'long'});
function listaDia(f){const cs=S.citas.filter(c=>c.fecha===f).sort((a,b)=>a.hora.localeCompare(b.hora));
 return cs.length?`<div class="dl">${cs.map(c=>{const k=ECOL[c.estado]||ECOL.Programada;return`<button class="ci" data-act="cita" data-id="${c.id}"><span class="h">${esc(c.hora)}</span><span style="flex:1"><b>${esc(cNom(c))}</b><span class="ayuda" style="display:block">${esc(c.motivo||'Consulta')} · ${esc(c.dur)} min${c.pid?'':' · paciente nuevo'}</span></span><span class="chip" style="background:${k[0]};color:${k[1]==='#64748B'?'#475569':k[1]==='#F59E0B'?'#92400E':k[1]}">${esc(c.estado)}</span></button>`}).join('')}</div>`:'<div class="vacio">No hay citas este día.</div>'}
V.agenda=()=>{const dias=[...Array(7)].map((_,i)=>{const d=new Date(agSem);d.setDate(d.getDate()+i);return d});const hoy=ymd(new Date());
 const fin=dias[6];const tit=`${dias[0].getDate()} de ${dias[0].toLocaleDateString('es-MX',{month:'long'})} al ${fin.getDate()} de ${fin.toLocaleDateString('es-MX',{month:'long',year:'numeric'})}`;
 let g=`<div class="hr" style="grid-row:1"></div>`+dias.map((d,i)=>`<div class="dh${ymd(d)===hoy?' hoy':''}" style="grid-column:${i+2}" data-act="agdia" data-f="${ymd(d)}" role="button" tabindex="0">${DIAS[i]}<b>${d.getDate()}</b></div>`).join('');
 for(let k=0;k<SLOTS;k++){const h=H0+Math.floor(k/2),mm=k%2?'30':'00';if(!(k%2))g+=`<div class="hr" style="grid-row:${k+2}">${h}:00</div>`;
  dias.forEach((d,i)=>{g+=`<button class="sl${k%2?' m':''}" style="grid-row:${k+2};grid-column:${i+2}" data-act="citanueva" data-f="${ymd(d)}" data-h="${p2(h)}:${mm}" aria-label="Agendar ${DIAS[i]} ${d.getDate()} a las ${h}:${mm}"></button>`})}
 const lane={};dias.forEach(d=>{const cs=S.citas.filter(c=>c.fecha===ymd(d)).sort((a,b)=>minu(a.hora)-minu(b.hora));let grp=[],fin=-1,ends=[];const cerrarG=()=>{grp.forEach(c=>lane[c.id].n=ends.length)};
  cs.forEach(c=>{const a=minu(c.hora),z=a+(+c.dur||30);if(a>=fin&&grp.length){cerrarG();grp=[];ends=[]}let l=ends.findIndex(e=>e<=a);if(l<0){l=ends.length;ends.push(z)}else ends[l]=z;lane[c.id]={l,n:1};grp.push(c);fin=Math.max(fin,z)});cerrarG()});

document.addEventListener('submit',e=>{e.preventDefault();const f=e.target;const fn=FM[f.dataset.form];if(fn)fn(f,e.submitter&&e.submitter.value)});

/* ---------- Archivos ---------- */
const leer=f=>new Promise((ok,no)=>{const r=new FileReader();r.onload=()=>ok(r.result);r.onerror=no;r.readAsDataURL(f)});
function achicar(file,max,tipo){return leer(file).then(src=>new Promise((ok,no)=>{const im=new Image();im.onload=()=>{const k=Math.min(1,max/Math.max(im.width,im.height));const c=document.createElement('canvas');c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);const x=c.getContext('2d');if(tipo==='image/jpeg'){x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height)}x.drawImage(im,0,0,c.width,c.height);ok(c.toDataURL(tipo,.82))};im.onerror=no;im.src=src}))}
async function bajar(nombre,blob){let dl=null;try{dl=window.claude&&window.claude.use?await window.claude.use('downloads'):null}catch(e){}
 if(dl){try{await dl.save({filename:nombre,data:blob});toast('Listo: '+nombre);return}catch(e){toast('La descarga se canceló o no se permitió.');return}}
 try{const u=URL.createObjectURL(blob);const a=document.createElement('a');a.href=u;a.download=nombre;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),4000)}catch(e){toast('La descarga no está disponible en esta vista.')}}

/* ---------- Firma con el dedo ---------- */
function initFirma(){const c=$('#cv');if(!c)return;const r=c.getBoundingClientRect();c.width=r.width*2;c.height=r.height*2;const x=c.getContext('2d');x.scale(2,2);x.lineWidth=2.4;x.lineCap='round';x.strokeStyle='#0f172a';
 if(S.medico.firma){const im=new Image();im.onload=()=>x.drawImage(im,0,0,r.width,r.height);im.src=S.medico.firma}
 let on=false;const pt=e=>{const b=c.getBoundingClientRect();return[e.clientX-b.left,e.clientY-b.top]};
 c.onpointerdown=e=>{on=true;c.setPointerCapture(e.pointerId);const[a,b]=pt(e);x.beginPath();x.moveTo(a,b)};
 c.onpointermove=e=>{if(!on)return;const[a,b]=pt(e);x.lineTo(a,b);x.stroke();c.dataset.d='1'};
 c.onpointerup=()=>on=false}

 y+=78;
 const sec=(t,txt)=>{if(!txt)return;doc.setFontSize(10);const l=doc.splitTextToSize(String(txt),W-2*M);nl(26+l.length*13);doc.setFont('helvetica','bold');doc.setFontSize(8.5);doc.setTextColor(...col);doc.text(t,M,y);y+=13;doc.setFont('helvetica','normal');doc.setFontSize(10);doc.setTextColor(15,23,42);l.forEach(x=>{nl(13);doc.text(x,M,y);y+=13});y+=8};
 const s=n.sig;sec('SIGNOS VITALES',VIT.filter(v=>s[v[0]]).map(v=>v[1].replace('₂','2')+': '+s[v[0]]).join('  ·  ')+(imc(s.peso,s.talla)?' · IMC '+imc(s.peso,s.talla):''));

 nl(110);y+=10;doc.setDrawColor(226,232,240);doc.setLineWidth(1);doc.line(M,y,W-M,y);y+=12;
 if(S.medico.firma&&n.medico===usuario()){try{doc.addImage(S.medico.firma,'PNG',M,y,150,50)}catch(e){}}
 y+=54;doc.setDrawColor(15,23,42);doc.line(M,y,M+220,y);y+=14;doc.setFont('helvetica','bold');doc.setFontSize(10.5);doc.text(n.medico||'',M,y);y+=13;
 doc.setFont('helvetica','normal');doc.setFontSize(9);doc.setTextColor(100,116,139);doc.text('Cédula profesional '+(n.cedula||'')+(S.medico.esp?' · '+S.medico.esp:''),M,y);y+=12;
 doc.text(n.firmada?'Firmada el '+fFH(n.firmadaEn):'BORRADOR — sin firma',M,y);y+=12;doc.setFont('courier','normal');doc.setFontSize(7.5);doc.text(doc.splitTextToSize('Sello digital SHA-256: '+(n.hash||'—'),W-2*M),M,y);
 pdfPie(doc,'Documento sellado conforme a NOM-004-SSA3-2012. No editable: las correcciones se agregan como addendum con fecha, hora y usuario.');
 log('Descargó PDF de nota',n.motivo+' · '+nom(p),p.id);save();
 await bajar(`nota-${p.folio}-${fF(n.creado).replace(/\//g,'-')}.pdf`,doc.output('blob'))}

let LOGO={};
function fyntPNG(color){if(LOGO[color])return LOGO[color];try{const c=document.createElement('canvas');c.width=168;c.height=204;const x=c.getContext('2d');x.scale(6,6);x.fillStyle=color;['M8 2 L26 0 Q22 9 12 10 L9 10 Z','M6 13 L23 11 Q19 20 10 21 L7 21 Z','M4 24 L13 23 Q10 31 2 34 Z'].forEach(d=>x.fill(new Path2D(d)));return LOGO[color]=c.toDataURL('image/png')}catch(e){return''}}

 let lx=M;if(c.logo){try{doc.addImage(c.logo,'PNG',M,y-6,44,44);lx=M+54}catch(e){}}else{const f=fyntPNG(c.color);if(f){doc.addImage(f,'PNG',M,y-6,34,41);lx=M+46}}

 if(f)doc.addImage(f,'PNG',48,751,11,13.4);doc.setFont('helvetica','bold');doc.setFontSize(8.5);doc.setTextColor(15,23,42);doc.text('Fynt',63,761);doc.setTextColor(0,119,182);doc.text('Medic',63+doc.getTextWidth('Fynt'),761);

 fil.forEach((f,i)=>{const cx=M+12+(i%2)*((W-2*M)/2),cy=y+17+Math.floor(i/2)*16;doc.setFont('helvetica','bold');doc.text(f[0]+':',cx,cy);const w=doc.getTextWidth(f[0]+':  ');doc.setFont('helvetica','normal');doc.text(String(f[1]),cx+w,cy)});
 y+=58;doc.setFont('helvetica','bold');doc.setFontSize(9);doc.setTextColor(...(p.alergias.length?[185,28,28]:[21,128,61]));doc.text('Alergias: '+(p.alergias.join(', ')||(p.sinAl?'niega':'no registradas')),M,y);y+=24;
